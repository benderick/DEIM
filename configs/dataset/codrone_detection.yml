task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 12
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /icislab/volume3/benderick/futurama/DEIM/data/CODrone/train/images
    ann_file: /icislab/volume3/benderick/futurama/DEIM/data/CODrone/train/annotations/instances_default.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /icislab/volume3/benderick/futurama/DEIM/data/CODrone/val/images
    ann_file: /icislab/volume3/benderick/futurama/DEIM/data/CODrone/val/annotations/instances_default.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction